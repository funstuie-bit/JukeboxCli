name: Mac install checks
on:
  push:
    branches: [main, development]
    paths: ["src/**", "test/**", "scripts/**", "Formula/**", "package*.json", "install.sh", "update.sh", ".github/workflows/mac-install.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build && npx tsx scripts/check-dist-imports.ts
      - name: Independent install and reinstall with an isolated profile
        run: npx tsx scripts/smoke-install.ts
      - name: Private source formula install and functional test
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          credential_cli="$(command -v gh)"
          git config --global credential.https://github.com.helper "!GH_TOKEN=\"\$HOMEBREW_GITHUB_API_TOKEN\" \"$credential_cli\" auth git-credential"
          brew tap funstuie-bit/jukeboxcli "$GITHUB_WORKSPACE"
          brew install --build-from-source funstuie-bit/jukeboxcli/jukeboxcli
          brew test funstuie-bit/jukeboxcli/jukeboxcli
