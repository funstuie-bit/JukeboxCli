name: Mac install checks
on:
  push:
    branches: [main]
    paths: ["src/**", "test/**", "scripts/**", "Formula/**", "package*.json", "install.sh", "update.sh", "vitest.config.ts", ".github/workflows/mac-install.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: Apple Silicon install
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install mpv for real player lifetime tests
        run: brew install mpv
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build && npx tsx scripts/check-dist-imports.ts
      - name: Independent install and reinstall with an isolated profile
        run: npx tsx scripts/smoke-install.ts
      - name: Source formula install and functional test
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew tap funstuie-bit/jukeboxcli "$GITHUB_WORKSPACE"
          brew install --build-from-source funstuie-bit/jukeboxcli/jukeboxcli
          brew test funstuie-bit/jukeboxcli/jukeboxcli
